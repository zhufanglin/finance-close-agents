services:
  app:
    build: .
    image: finance-ai-demo:latest
    container_name: finance-ai-demo
    restart: unless-stopped
    mem_limit: 512m        # 单容器内存上限，防吃爆小内存服务器
    ports:
      - "3000:3000"   # 本机默认；公网若端口被占用可改为 "3100:3000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-请填入你的Key}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OCR_PYTHON=/usr/bin/python3
      - DATABASE_URL=file:/app/data/dev.db
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data        # SQLite 数据库持久化（目录挂载，勿用单文件挂载）
      - ./uploads:/app/uploads  # 上传的发票原图持久化
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
